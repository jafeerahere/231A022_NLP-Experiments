name: Sentiment analysis checks
on:
  push:
    paths: ['sentiment-analysis/**', '.github/workflows/sentiment-analysis.yml']
  pull_request:
    paths: ['sentiment-analysis/**', '.github/workflows/sentiment-analysis.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sentiment-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sentiment-analysis/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
